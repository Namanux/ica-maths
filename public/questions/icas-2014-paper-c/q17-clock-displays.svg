<svg viewBox="0 0 420 100" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="16">
  <rect x="0" y="0" width="420" height="100" fill="#ffffff"/>
  <!-- L: oval display -->
  <ellipse cx="45" cy="35" rx="42" ry="26" fill="none" stroke="#111827" stroke-width="2"/>
  <text x="45" y="40" text-anchor="middle" fill="#111827" font-size="12">03:30 AM</text>
  <text x="45" y="80" text-anchor="middle" fill="#111827" font-weight="bold">L</text>

  <!-- M: square display -->
  <rect x="128" y="12" width="76" height="46" fill="none" stroke="#111827" stroke-width="2"/>
  <text x="166" y="40" text-anchor="middle" fill="#111827" font-size="12">16:15</text>
  <text x="166" y="80" text-anchor="middle" fill="#111827" font-weight="bold">M</text>

  <!-- N: rounded-rect display -->
  <rect x="238" y="12" width="76" height="46" rx="14" fill="none" stroke="#111827" stroke-width="2"/>
  <text x="276" y="40" text-anchor="middle" fill="#111827" font-size="12">04:30 PM</text>
  <text x="276" y="80" text-anchor="middle" fill="#111827" font-weight="bold">N</text>

  <!-- O: circle display -->
  <circle cx="378" cy="35" r="30" fill="none" stroke="#111827" stroke-width="2"/>
  <text x="378" y="40" text-anchor="middle" fill="#111827" font-size="12">13:20</text>
  <text x="378" y="80" text-anchor="middle" fill="#111827" font-weight="bold">O</text>
</svg>
