<svg viewBox="0 0 340 300" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="14">
  <rect x="0" y="0" width="340" height="300" fill="#ffffff"/>
  <!-- (A) square with a right angle at every corner -->
  <rect x="30" y="20" width="90" height="90" fill="#cbd5e1" stroke="#111827" stroke-width="2"/>
  <path d="M30,32 h12 v-12" fill="none" stroke="#111827" stroke-width="2"/>
  <path d="M108,20 v12 h12" fill="none" stroke="#111827" stroke-width="2"/>
  <path d="M120,98 h-12 v12" fill="none" stroke="#111827" stroke-width="2"/>
  <path d="M42,110 v-12 h-12" fill="none" stroke="#111827" stroke-width="2"/>
  <text x="75" y="132" text-anchor="middle" fill="#111827">(A)</text>

  <!-- (B) equilateral-looking triangle, no right angle -->
  <polygon points="245,20 300,110 190,110" fill="#111827"/>
  <text x="245" y="132" text-anchor="middle" fill="#111827">(B)</text>

  <!-- (C) right triangle with one right angle marked (correct answer) -->
  <polygon points="30,170 30,270 120,270" fill="#cbd5e1" stroke="#111827" stroke-width="2"/>
  <path d="M30,258 h12 v12" fill="none" stroke="#111827" stroke-width="2"/>
  <text x="75" y="292" text-anchor="middle" fill="#111827">(C)</text>

  <!-- (D) tilted parallelogram, no right angle -->
  <polygon points="230,170 300,190 275,270 205,250" fill="#111827"/>
  <text x="252" y="292" text-anchor="middle" fill="#111827">(D)</text>
</svg>
