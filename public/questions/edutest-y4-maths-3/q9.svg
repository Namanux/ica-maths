    <rect x="330" y="12" width="18" height="18"/><rect x="348" y="12" width="18" height="18"/><rect x="330" y="30" width="18" height="18"/><rect x="348" y="30" width="18" height="18"/><rect x="330" y="48" width="18" height="18"/>
