<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" role="img" aria-label="Three by three number grid. Row one: 2, 4, question mark. Row two: 4, 6, 8. Row three: 6, 8, 10.">
  <rect x="0" y="0" width="300" height="300" fill="#ffffff"/>
  <g stroke="#111111" stroke-width="3" fill="none">
    <rect x="6" y="6" width="288" height="288"/>
    <line x1="102" y1="6" x2="102" y2="294"/>
    <line x1="198" y1="6" x2="198" y2="294"/>
    <line x1="6" y1="102" x2="294" y2="102"/>
    <line x1="6" y1="198" x2="294" y2="198"/>
  </g>
  <g fill="#111111" font-family="Georgia, 'Times New Roman', serif" font-size="40" text-anchor="middle">
    <text x="54"  y="67">2</text>
    <text x="150" y="67">4</text>
    <text x="246" y="67">?</text>
    <text x="54"  y="163">4</text>
    <text x="150" y="163">6</text>
    <text x="246" y="163">8</text>
    <text x="54"  y="259">6</text>
    <text x="150" y="259">8</text>
    <text x="246" y="259">10</text>
  </g>
</svg>
