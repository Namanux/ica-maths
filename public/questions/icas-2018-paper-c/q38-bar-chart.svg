<svg viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="12">
  <line x1="40" y1="20" x2="40" y2="180" stroke="currentColor" stroke-width="1.5"/>
  <line x1="40" y1="180" x2="300" y2="180" stroke="currentColor" stroke-width="1.5"/>
  <g fill="currentColor" text-anchor="end">
    <text x="35" y="24">12</text><text x="35" y="64">9</text><text x="35" y="104">6</text>
    <text x="35" y="144">3</text><text x="35" y="184">0</text>
  </g>
  <g stroke="currentColor" stroke-width="0.4" opacity="0.3">
    <line x1="40" y1="20" x2="300" y2="20"/><line x1="40" y1="60" x2="300" y2="60"/>
    <line x1="40" y1="100" x2="300" y2="100"/><line x1="40" y1="140" x2="300" y2="140"/>
  </g>

  <!-- car: diesel 2, petrol 10 -->
  <rect x="55" y="153.3" width="20" height="26.7" fill="#2563eb"/>
  <rect x="78" y="46.7" width="20" height="133.3" fill="#9ca3af"/>
  <text x="76" y="198" text-anchor="middle" fill="currentColor">car</text>

  <!-- truck: diesel 8, petrol 2 -->
  <rect x="130" y="73.3" width="20" height="106.7" fill="#2563eb"/>
  <rect x="153" y="153.3" width="20" height="26.7" fill="#9ca3af"/>
  <text x="151" y="198" text-anchor="middle" fill="currentColor">truck</text>

  <!-- SUV: diesel 6, petrol 12 -->
  <rect x="205" y="100" width="20" height="80" fill="#2563eb"/>
  <rect x="228" y="20" width="20" height="160" fill="#9ca3af"/>
  <text x="226" y="198" text-anchor="middle" fill="currentColor">SUV</text>

  <rect x="255" y="15" width="12" height="12" fill="#2563eb"/>
  <text x="272" y="25" fill="currentColor" font-size="11">diesel</text>
  <rect x="255" y="32" width="12" height="12" fill="#9ca3af"/>
  <text x="272" y="42" fill="currentColor" font-size="11">petrol</text>
