<svg viewBox="0 0 300 220" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="12">
  <!-- balance 1: left=yellow square, right=blue kite (heavier) -->
  <g transform="translate(150,40)">
    <line x1="-100" y1="-15" x2="100" y2="15" stroke="currentColor" stroke-width="3"/>
    <polygon points="0,-6 8,0 0,6 -8,0" fill="currentColor"/>
    <rect x="-115" y="-25" width="16" height="16" fill="#eab308"/>
    <polygon points="95,10 111,18 103,26 87,18" fill="#3b82f6"/>
  </g>
  <text x="150" y="55" text-anchor="middle" fill="currentColor" font-size="11">blue &gt; yellow</text>

  <!-- balance 2: left=red, right=yellow (left heavier) -->
  <g transform="translate(150,110)">
    <line x1="-100" y1="15" x2="100" y2="-15" stroke="currentColor" stroke-width="3"/>
    <polygon points="0,-6 8,0 0,6 -8,0" fill="currentColor"/>
    <circle cx="-103" cy="23" r="9" fill="#dc2626"/>
    <rect x="87" y="-32" width="16" height="16" fill="#eab308"/>
  </g>
  <text x="150" y="140" text-anchor="middle" fill="currentColor" font-size="11">red &gt; yellow</text>

  <!-- balance 3: left=yellow+blue, right=red+red (right heavier) -->
  <g transform="translate(150,180)">
    <line x1="-100" y1="-15" x2="100" y2="15" stroke="currentColor" stroke-width="3"/>
    <polygon points="0,-6 8,0 0,6 -8,0" fill="currentColor"/>
    <rect x="-120" y="-25" width="14" height="14" fill="#eab308"/>
    <polygon points="-100,-25 -92,-19 -100,-13 -108,-19" fill="#3b82f6"/>
    <circle cx="95" cy="20" r="8" fill="#dc2626"/>
    <circle cx="110" cy="26" r="8" fill="#dc2626"/>
  </g>
  <text x="150" y="205" text-anchor="middle" fill="currentColor" font-size="11">red+red &gt; yellow+blue</text>
</svg>
