<svg viewBox="0 0 340 260" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="13">
  <text x="20" y="20" fill="currentColor" font-size="12" opacity="0.7">Kevin's triangle, cut along its axis of symmetry:</text>
  <polygon points="70,30 100,105 40,105" fill="currentColor" opacity="0.75"/>
  <line x1="70" y1="30" x2="70" y2="105" stroke="var(--background,#fff)" stroke-width="2" stroke-dasharray="4,3"/>

  <line x1="0" y1="130" x2="340" y2="130" stroke="currentColor" opacity="0.2"/>
  <text x="20" y="150" fill="currentColor" font-size="12" opacity="0.7">Options:</text>

  <g transform="translate(55,205)">
    <polygon points="-40,20 10,20 40,-20 -10,-20" fill="currentColor" opacity="0.75"/>
  </g>
  <text x="55" y="245" text-anchor="middle" fill="currentColor">(A)</text>

  <g transform="translate(145,205)">
    <polygon points="-15,45 15,45 30,-45 0,-45" fill="currentColor" opacity="0.75"/>
  </g>
  <text x="145" y="245" text-anchor="middle" fill="currentColor">(B)</text>

  <g transform="translate(235,205)">
    <polygon points="-20,40 5,10 -5,-10 25,-40 10,10 20,40" fill="currentColor" opacity="0.75"/>
  </g>
  <text x="235" y="245" text-anchor="middle" fill="currentColor">(C)</text>

  <g transform="translate(300,205)">
    <polygon points="-5,45 5,45 25,-45 15,-45" fill="currentColor" opacity="0.75"/>
  </g>
  <text x="300" y="245" text-anchor="middle" fill="currentColor">(D)</text>
</svg>
