<svg viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="11">
  <rect x="20" y="20" width="200" height="24" fill="currentColor" opacity="0.6"/>
  <line x1="120" y1="10" x2="120" y2="54" stroke="currentColor" stroke-dasharray="3,2"/>
  <text x="120" y="65" text-anchor="middle" fill="currentColor">fold line</text>
  <text x="120" y="80" text-anchor="middle" fill="currentColor" font-size="10">1st fold: in half</text>

  <rect x="20" y="95" width="100" height="24" fill="currentColor" opacity="0.6"/>
  <text x="70" y="128" text-anchor="middle" fill="currentColor" font-size="10">2nd fold: in half again, then cut down the middle</text>

  <rect x="220" y="95" width="50" height="24" fill="currentColor" opacity="0.6"/>
