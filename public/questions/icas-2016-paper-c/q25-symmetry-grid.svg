<svg viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="12">
  <!-- 5x5 grid, cell=40px -->
  <g stroke="currentColor" stroke-width="0.75" opacity="0.5">
    <line x1="10" y1="10" x2="10" y2="210"/><line x1="50" y1="10" x2="50" y2="210"/>
    <line x1="90" y1="10" x2="90" y2="210"/><line x1="130" y1="10" x2="130" y2="210"/>
    <line x1="170" y1="10" x2="170" y2="210"/><line x1="210" y1="10" x2="210" y2="210"/>
    <line x1="10" y1="10" x2="210" y2="10"/><line x1="10" y1="50" x2="210" y2="50"/>
    <line x1="10" y1="90" x2="210" y2="90"/><line x1="10" y1="130" x2="210" y2="130"/>
    <line x1="10" y1="170" x2="210" y2="170"/><line x1="10" y1="210" x2="210" y2="210"/>
  </g>
  <!-- shaded green L-shaped region already coloured -->
  <g fill="#22c55e" opacity="0.75">
    <rect x="10" y="10" width="40" height="40"/>
    <rect x="10" y="50" width="80" height="40"/>
    <rect x="10" y="90" width="120" height="40"/>
    <rect x="10" y="130" width="160" height="40"/>
    <rect x="10" y="170" width="40" height="40"/>
    <rect x="130" y="170" width="40" height="40"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <rect x="50" y="10" width="40" height="40"/>
    <text x="70" y="34" fill="currentColor" text-anchor="middle" stroke="none">(A)</text>
    <rect x="170" y="130" width="40" height="40"/>
    <text x="190" y="154" fill="currentColor" text-anchor="middle" stroke="none">(B)</text>
    <rect x="10" y="170" width="0" height="0"/>
    <text x="30" y="194" fill="currentColor" text-anchor="middle" stroke="none">(C)</text>
    <rect x="90" y="170" width="40" height="40"/>
    <text x="110" y="194" fill="currentColor" text-anchor="middle" stroke="none">(D)</text>
  </g>
</svg>
