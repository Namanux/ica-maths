<svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <text x="160" y="18" text-anchor="middle" font-size="14" font-weight="bold" fill="currentColor">Money Raised at School Fair</text>

  <!-- axis -->
  <line x1="50" y1="30" x2="50" y2="210" stroke="currentColor" stroke-width="1.5" />
  <line x1="50" y1="210" x2="290" y2="210" stroke="currentColor" stroke-width="1.5" />

  <!-- y gridlines 0,10,...,60 -->
  <g font-size="10" fill="currentColor">
    <text x="42" y="213" text-anchor="end">0</text>
    <text x="42" y="183" text-anchor="end">10</text>
    <text x="42" y="153" text-anchor="end">20</text>
    <text x="42" y="123" text-anchor="end">30</text>
    <text x="42" y="93" text-anchor="end">40</text>
    <text x="42" y="63" text-anchor="end">50</text>
    <text x="42" y="33" text-anchor="end">60</text>
  </g>
  <line x1="50" y1="183" x2="290" y2="183" stroke="var(--border)" stroke-width="1" />
  <line x1="50" y1="153" x2="290" y2="153" stroke="var(--border)" stroke-width="1" />
  <line x1="50" y1="123" x2="290" y2="123" stroke="var(--border)" stroke-width="1" />
  <line x1="50" y1="93" x2="290" y2="93" stroke="var(--border)" stroke-width="1" />
  <line x1="50" y1="63" x2="290" y2="63" stroke="var(--border)" stroke-width="1" />

  <!-- bars: A=60, B=28, C=19, D=43 (3 units per $, bottom at y=210) -->
  <rect x="70" y="30" width="40" height="180" fill="#3b82f6" />
  <text x="90" y="228" text-anchor="middle" font-size="13" fill="currentColor">(A)</text>

  <rect x="130" y="126" width="40" height="84" fill="#3b82f6" />
  <text x="150" y="228" text-anchor="middle" font-size="13" fill="currentColor">(B)</text>

  <rect x="190" y="153" width="40" height="57" fill="#3b82f6" />
  <text x="210" y="228" text-anchor="middle" font-size="13" fill="currentColor">(C)</text>

  <rect x="250" y="81" width="40" height="129" fill="#3b82f6" />
  <text x="270" y="228" text-anchor="middle" font-size="13" fill="currentColor">(D)</text>

  <text x="170" y="248" text-anchor="middle" font-size="12" fill="currentColor">Activity</text>
</svg>
