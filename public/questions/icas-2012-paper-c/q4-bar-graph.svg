<svg viewBox="0 0 420 260" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <text x="210" y="20" text-anchor="middle" font-size="16" font-weight="bold" fill="currentColor">Favourite Colour</text>

  <!-- axis -->
  <line x1="90" y1="40" x2="90" y2="210" stroke="currentColor" stroke-width="1.5" />
  <line x1="90" y1="210" x2="400" y2="210" stroke="currentColor" stroke-width="1.5" />

  <!-- gridlines + x labels, 0-10 -->
  <g font-size="11" fill="currentColor">
    <text x="90" y="225" text-anchor="middle">0</text>
    <text x="121" y="225" text-anchor="middle">1</text>
    <text x="152" y="225" text-anchor="middle">2</text>
    <text x="183" y="225" text-anchor="middle">3</text>
    <text x="214" y="225" text-anchor="middle">4</text>
    <text x="245" y="225" text-anchor="middle">5</text>
    <text x="276" y="225" text-anchor="middle">6</text>
    <text x="307" y="225" text-anchor="middle">7</text>
    <text x="338" y="225" text-anchor="middle">8</text>
    <text x="369" y="225" text-anchor="middle">9</text>
    <text x="400" y="225" text-anchor="middle">10</text>
  </g>
  <text x="245" y="245" text-anchor="middle" font-size="12" fill="currentColor">Number of students</text>

  <!-- bars: black=5, blue=7, pink=3, red=5, white=8 -->
  <g>
    <rect x="90" y="48" width="155" height="22" fill="#374151" />
    <text x="82" y="63" text-anchor="end" font-size="12" fill="currentColor">black</text>

    <rect x="90" y="78" width="217" height="22" fill="#3b82f6" />
    <text x="82" y="93" text-anchor="end" font-size="12" fill="currentColor">blue</text>

    <rect x="90" y="108" width="93" height="22" fill="#ec4899" />
    <text x="82" y="123" text-anchor="end" font-size="12" fill="currentColor">pink</text>

    <rect x="90" y="138" width="155" height="22" fill="#ef4444" />
    <text x="82" y="153" text-anchor="end" font-size="12" fill="currentColor">red</text>

    <rect x="90" y="168" width="248" height="22" fill="white" stroke="currentColor" stroke-width="1.5" />
    <text x="82" y="183" text-anchor="end" font-size="12" fill="currentColor">white</text>
  </g>
</svg>
