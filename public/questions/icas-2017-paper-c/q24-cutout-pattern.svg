<svg viewBox="0 0 200 140" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="12">
  <defs>
    <pattern id="diag" width="10" height="10" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="currentColor" stroke-width="2"/>
    </pattern>
  </defs>
  <rect x="10" y="10" width="120" height="90" fill="url(#diag)" opacity="0.6" stroke="currentColor"/>
  <rect x="70" y="35" width="40" height="30" fill="var(--background,#fff)" stroke="currentColor" stroke-dasharray="3,2"/>
  <text x="70" y="120" text-anchor="middle" fill="currentColor">square with piece removed</text>

  <rect x="150" y="35" width="40" height="30" fill="url(#diag)" opacity="0.6" stroke="currentColor"/>
  <text x="170" y="120" text-anchor="middle" fill="currentColor">(D) matching piece</text>
</svg>
