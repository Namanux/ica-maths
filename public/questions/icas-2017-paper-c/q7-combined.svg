  <polygon points="30,35 65,70 30,105 -5,70" transform="translate(5,0)" fill="currentColor" opacity="0.75"/>

  <line x1="0" y1="130" x2="340" y2="130" stroke="currentColor" opacity="0.2"/>
  <text x="30" y="150" fill="currentColor" font-size="12" opacity="0.7">Options:</text>

  <g transform="translate(30,190)">
