<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- three hexagons arranged in a cluster, each made of 6 small triangles on a triangular grid -->
  <g stroke="currentColor" stroke-width="1" fill="currentColor" opacity="0.6">
    <polygon points="70,40 100,25 130,40 130,70 100,85 70,70"/>
    <polygon points="40,90 70,75 100,90 100,120 70,135 40,120"/>
    <polygon points="100,90 130,75 160,90 160,120 130,135 100,120"/>
  </g>
  <g stroke="currentColor" stroke-width="0.5" fill="none" opacity="0.4">
    <line x1="70" y1="40" x2="100" y2="25"/>
    <line x1="100" y1="25" x2="130" y2="40"/>
    <line x1="130" y1="40" x2="130" y2="70"/>
    <line x1="130" y1="70" x2="100" y2="85"/>
    <line x1="100" y1="85" x2="70" y2="70"/>
    <line x1="70" y1="70" x2="70" y2="40"/>
    <line x1="100" y1="55" x2="70" y2="40"/>
    <line x1="100" y1="55" x2="130" y2="40"/>
    <line x1="100" y1="55" x2="130" y2="70"/>
    <line x1="100" y1="55" x2="100" y2="85"/>
    <line x1="100" y1="55" x2="70" y2="70"/>
    <line x1="100" y1="55" x2="100" y2="25"/>
  </g>
</svg>
