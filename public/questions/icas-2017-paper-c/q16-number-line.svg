<svg viewBox="0 0 320 90" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="13">
  <line x1="20" y1="50" x2="300" y2="50" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="currentColor"/>
    </marker>
  </defs>
  <text x="20" y="70" text-anchor="middle" fill="currentColor">0.4</text>
  <text x="300" y="70" text-anchor="middle" fill="currentColor">0.8</text>
  <line x1="20" y1="45" x2="20" y2="55" stroke="currentColor"/>
  <line x1="300" y1="45" x2="300" y2="55" stroke="currentColor"/>

  <!-- points A,B,C,D at various positions between 0.4 and 0.8 -->
  <line x1="90" y1="25" x2="90" y2="45" stroke="currentColor"/>
  <text x="90" y="18" text-anchor="middle" fill="currentColor">A</text>

  <line x1="120" y1="25" x2="120" y2="45" stroke="currentColor"/>
  <text x="120" y="18" text-anchor="middle" fill="currentColor">B</text>

  <line x1="228" y1="25" x2="228" y2="45" stroke="currentColor"/>
  <text x="228" y="18" text-anchor="middle" fill="currentColor">C</text>

  <line x1="275" y1="25" x2="275" y2="45" stroke="currentColor"/>
  <text x="275" y="18" text-anchor="middle" fill="currentColor">D</text>
</svg>
