<svg viewBox="0 0 340 100" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="12">
  <!-- simplified 2D block-footprint depictions of 5-cube arrangements -->
  <g transform="translate(10,10)" fill="currentColor" opacity="0.7" stroke="currentColor">
    <rect x="0" y="0" width="20" height="20"/>
    <rect x="0" y="20" width="20" height="20"/>
    <rect x="0" y="40" width="20" height="20"/>
    <rect x="20" y="40" width="20" height="20"/>
    <rect x="40" y="40" width="20" height="20"/>
  </g>
  <text x="30" y="80" text-anchor="middle" fill="currentColor">(A)</text>

  <g transform="translate(100,10)" fill="currentColor" opacity="0.7" stroke="currentColor">
    <rect x="0" y="0" width="20" height="20"/>
    <rect x="0" y="20" width="20" height="20"/>
    <rect x="20" y="20" width="20" height="20"/>
    <rect x="40" y="20" width="20" height="20"/>
    <rect x="40" y="0" width="20" height="20"/>
  </g>
  <text x="130" y="80" text-anchor="middle" fill="currentColor">(B)</text>

  <g transform="translate(190,10)" fill="currentColor" opacity="0.7" stroke="currentColor">
    <rect x="20" y="0" width="20" height="20"/>
    <rect x="20" y="20" width="20" height="20"/>
    <rect x="0" y="40" width="20" height="20"/>
    <rect x="20" y="40" width="20" height="20"/>
    <rect x="40" y="40" width="20" height="20"/>
  </g>
  <text x="220" y="80" text-anchor="middle" fill="currentColor">(C)</text>

  <g transform="translate(270,10)" fill="currentColor" opacity="0.7" stroke="currentColor">
    <rect x="0" y="40" width="20" height="20"/>
    <rect x="0" y="20" width="20" height="20"/>
    <rect x="0" y="0" width="20" height="20"/>
    <rect x="20" y="0" width="20" height="20"/>
    <rect x="40" y="0" width="20" height="20"/>
  </g>
  <text x="300" y="80" text-anchor="middle" fill="currentColor">(D)</text>
</svg>
