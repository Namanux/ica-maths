<svg viewBox="0 0 340 130" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="13">
  <!-- Each option shows unit squares with shaded portion representing a fraction -->
  <!-- (A) 1 1/4 : one full square + one square split in 4, 1 shaded -->
  <g transform="translate(10,10)">
    <rect x="0" y="0" width="35" height="35" fill="currentColor" opacity="0.75"/>
    <rect x="40" y="0" width="35" height="35" fill="none" stroke="currentColor"/>
    <rect x="40" y="0" width="8.75" height="35" fill="currentColor" opacity="0.75"/>
    <line x1="48.75" y1="0" x2="48.75" y2="35" stroke="currentColor" stroke-width="0.5"/>
    <line x1="57.5" y1="0" x2="57.5" y2="35" stroke="currentColor" stroke-width="0.5"/>
    <line x1="66.25" y1="0" x2="66.25" y2="35" stroke="currentColor" stroke-width="0.5"/>
    <text x="37" y="55" text-anchor="middle" fill="currentColor">(A)</text>
  </g>
  <!-- (B) 1 3/4 correct: one full square + one square split in 4, 3 shaded -->
  <g transform="translate(100,10)">
    <rect x="0" y="0" width="35" height="35" fill="currentColor" opacity="0.75"/>
    <rect x="40" y="0" width="35" height="35" fill="none" stroke="currentColor"/>
    <rect x="40" y="0" width="26.25" height="35" fill="currentColor" opacity="0.75"/>
    <line x1="48.75" y1="0" x2="48.75" y2="35" stroke="currentColor" stroke-width="0.5"/>
    <line x1="57.5" y1="0" x2="57.5" y2="35" stroke="currentColor" stroke-width="0.5"/>
    <line x1="66.25" y1="0" x2="66.25" y2="35" stroke="currentColor" stroke-width="0.5"/>
    <text x="37" y="55" text-anchor="middle" fill="currentColor">(B)</text>
  </g>
  <!-- (C) 1/2 : one square split in half, 1 shaded -->
  <g transform="translate(190,10)">
    <rect x="0" y="0" width="35" height="35" fill="none" stroke="currentColor"/>
    <rect x="0" y="0" width="17.5" height="35" fill="currentColor" opacity="0.75"/>
    <text x="17" y="55" text-anchor="middle" fill="currentColor">(C)</text>
  </g>
  <!-- (D) 2 : two full squares -->
  <g transform="translate(255,10)">
    <rect x="0" y="0" width="35" height="35" fill="currentColor" opacity="0.75"/>
    <rect x="40" y="0" width="35" height="35" fill="currentColor" opacity="0.75"/>
    <text x="37" y="55" text-anchor="middle" fill="currentColor">(D)</text>
  </g>
</svg>
